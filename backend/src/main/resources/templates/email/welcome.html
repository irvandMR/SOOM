<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .container { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .header { background: #1565A0; padding: 32px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 22px; }
        .body { padding: 32px; }
        .body p { color: #444; font-size: 14px; line-height: 1.6; }
        .info-box { background: #F0F7FF; border-radius: 8px; padding: 20px 24px; margin: 24px 0; }
        .info-row { display: flex; margin-bottom: 10px; font-size: 14px; }
        .info-label { color: #888; width: 90px; flex-shrink: 0; }
        .info-value { color: #1a1a1a; font-weight: bold; }
        .btn { display: block; width: fit-content; margin: 0 auto; background: #1565A0; color: #fff; padding: 12px 32px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .footer { text-align: center; padding: 20px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Selamat Datang di Soom! 👋</h1>
    </div>
    <div class="body">
        <p>Halo <strong th:text="${name}">User</strong>,</p>
        <p>Akun kamu telah berhasil dibuat. Berikut informasi login kamu:</p>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Nama</span>
                <span class="info-value" th:text="${name}">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Email</span>
                <span class="info-value" th:text="${email}">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Password</span>
                <span class="info-value" th:text="${password}">-</span>
            </div>
        </div>

        <p>Segera login dan ganti password kamu ya!</p>
        <a href="#" class="btn">Login Sekarang</a>
    </div>
    <div class="footer">
        &copy; 2025 Soom. All rights reserved.
    </div>
</div>
</body>
</html>
