<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />

    <style>
        @page {
            size: A4;
            margin-top: 2cm;
            margin-bottom: 2cm;
            margin-left: 2.5cm;
            margin-right: 2.5cm;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 13px;
            background: white;
            margin: 0;
        }

        .container {
            width: 100%;
        }

        /* HEADER */
        .header {
            width: 100%;
        }

        .header-table {
            width: 100%;
        }

        .brand {
            color: #6B8FA0;
            font-size: 18px;
            font-weight: bold;
        }

        .right {
            text-align: right;
        }

        hr {
            border: 0;
            border-top: 1px solid #ccc;
            margin: 10px 0;
        }

        /* INFO (2 COLUMN FIX) */
        .info-table {
            width: 100%;
            background: #EEF4F7;
            border-radius: 6px;
            padding: 10px;
        }

        .info-table td {
            vertical-align: top;
            width: 50%;
        }

        .label {
            font-size: 11px;
            color: #7A8A93;
        }

        .value {
            font-weight: bold;
        }

        /* TABLE ITEM */
        table.items {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        table.items th {
            background: #DCE6EC;
            padding: 8px;
            text-align: left;
        }

        table.items td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        table.items td, table.items th {
            word-wrap: break-word;
        }

        table, tr, td {
            page-break-inside: avoid;
        }

        /* TOTAL */
        .total-table {
            width: 280px;
            margin-left: auto;
            margin-top: 15px;
            border-collapse: collapse;
        }

        .total-table td {
            padding: 4px 0;
        }

        .total-table td:first-child {
            text-align: left;
        }

        .total-table td:last-child {
            text-align: right;
        }

        .green {
            color: #2ecc71;
        }

        .red {
            color: #e74c3c;
            font-weight: bold;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .green {
            color: #2ecc71;
        }

        .red {
            color: #e74c3c;
            font-weight: bold;
        }

        /* NOTES */
        .notes {
            margin-top: 15px;
            background: #EEF4F7;
            padding: 10px;
            font-size: 12px;
            color: #7A8A93;
        }

        /* FOOTER */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #7A8A93;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <table class="header-table">
        <tr>
            <td>
                <div class="brand" th:text="${businessName}"></div>
                <div class="business-info" th:text="${businessAddress}"></div>
                <div class="business-info" th:text="${businessPhone}"></div>
                <div class="business-info" th:text="${businessEmail}"></div>
            </td>
            <td class="right">
                <div style="font-weight:bold;">NOTA ORDER</div>
                <div th:text="${orderNumber}"></div>
                <div style="font-size:12px;color:#7A8A93;" th:text="${orderDate}"></div>
            </td>
        </tr>
    </table>

    <hr />

    <!-- INFO 2 COLUMN -->
    <table class="info-table">
        <tr>

            <!-- KIRI (CUSTOMER) -->
            <td>
                <div class="label">Kepada</div>
                <div class="value" th:text="${customerName}"></div>
                <div th:text="${customerPhone}"></div>
                <div th:text="${customerAddress}"></div>
            </td>

            <!-- KANAN (TGL + STATUS) -->
            <td class="right">
                <div class="label">Tgl Dibutuhkan</div>
                <div class="value" th:text="${requiredDate}"></div>

                <div class="label" style="margin-top:8px;">Status</div>
                <div style="color:#6B8FA0;" th:text="${paymentStatus}"></div>
            </td>

        </tr>
    </table>

    <!-- TABLE ITEM -->
    <table class="items">
        <thead>
        <tr>
            <th>Produk</th>
            <th>Qty</th>
            <th class="right">Harga</th>
            <th class="right">Subtotal</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.productName}"></td>
            <td th:text="${item.quantity}"></td>
            <td class="right" th:text="${item.unitPrice}"></td>
            <td class="right" th:text="${item.subtotal}"></td>
        </tr>
        </tbody>
    </table>

    <!-- TOTAL -->
    <table class="total-table">

        <tr>
            <td>Total</td>
            <td class="right"><b th:text="${totalAmount}"></b></td>
        </tr>

        <!-- HANYA JIKA BUKAN LUNAS -->
        <tr th:if="${paymentStatus != 'Lunas'}">
            <td>DP Dibayar</td>
            <td class="right green" th:text="${paidAmount}"></td>
        </tr>

        <tr th:if="${paymentStatus != 'Lunas'}">
            <td class="red">Sisa Tagihan</td>
            <td class="right red" th:text="${remainingAmount}"></td>
        </tr>

    </table>

    <!-- NOTES -->
    <div class="notes" th:if="${notes != null}">
        Catatan : <i th:text="${notes}"></i>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Terima kasih — <span th:text="${businessName}"></span>
    </div>

</div>

</body>
</html>
